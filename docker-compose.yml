version: "3.8"

services:

  onlinebankingportal:

    build: .

    container_name: onlinebankingportal

    restart: always

    ports:
      - "8080:8080"

    environment:
      APP_ENV: production
      JAVA_OPTS: -Xms256m -Xmx512m

    volumes:
      - tomcat_logs:/usr/local/tomcat/logs

volumes:

  tomcat_logs: